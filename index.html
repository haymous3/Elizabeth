<!doctype html>
<html lang="en" class="is-locked">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#1a050b">
  <title>Happy Birthday</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23c8456b' d='M12 21s-8-4.9-10.2-9.9C.2 7.4 2.4 3.8 6 3.8c2.3 0 3.8 1.3 4.7 2.8L12 8.5l1.3-1.9c.9-1.5 2.4-2.8 4.7-2.8 3.6 0 5.8 3.6 4.2 7.3C20 16.1 12 21 12 21z'/%3E%3C/svg%3E">
  <script>
    // Hide the cinema until the intro animation is ready, so nothing flashes. Safety net: show it anyway after 3s.
    if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
      document.documentElement.classList.add("motion-pending");
      setTimeout(function () { document.documentElement.classList.remove("motion-pending"); }, 3000);
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Pinyon+Script&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script defer src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js" integrity="sha384-HOvlOYPIs/zjoIkWUGXkVmXsjr8GuZLV+Q+rcPwmJOVZVpvTSXQChiN4t9Euv9Vc" crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js" integrity="sha384-P8VzCVnT9NBUkMrpcIZrJbA7EBjJvh/fJS6PmP+4nLIM284DtsImIv8D0fFjIkeh" crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/SplitText.min.js" integrity="sha384-xb96EMJeax+NLXMC88ZBa1xAeAW+kn+horHh/zFlbMLG2UPWhMJJSlv7fi57hS+Q" crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js" integrity="sha384-sPwMflxqfAN+Q5mvlkLmHiX3PORGbZSXHiSGPTXT9VHCD/AB+b+r+vJWsqprv+7k" crossorigin="anonymous"></script>
  <script defer src="js/config.js"></script>
  <script defer src="js/motion.js"></script>
  <script defer src="js/music.js"></script>
  <script defer src="js/cinema.js"></script>
  <script defer src="js/game.js"></script>
  <script defer src="js/finale.js"></script>
  <script defer src="js/main.js"></script>
</head>
<body>

  <main id="site">

    <!-- [0] The cinema: she taps the ticket, the curtains open, the film plays -->
    <section class="cinema" id="cinema">
      <div class="cinema__bar cinema__bar--top" aria-hidden="true"></div>
      <div class="cinema__bar cinema__bar--bottom" aria-hidden="true"></div>

      <header class="marquee">
        <div class="marquee__bulbs" aria-hidden="true"></div>
        <p class="marquee__kicker" data-text="cinema.kicker"></p>
        <p class="marquee__title" data-text="song.title"></p>
        <p class="marquee__sub" data-text="cinema.subtitle"></p>
        <div class="marquee__bulbs" aria-hidden="true"></div>
      </header>

      <div class="stage">
        <div class="screen" id="screen">
          <div class="player" id="player"><div id="yt-player"></div></div>
          <p class="screen__hint" id="screen-hint" hidden data-text="cinema.waiting"></p>
          <div class="screen__fallback" id="screen-fallback" hidden>
            <p data-text="cinema.failed"></p>
            <a id="fallback-link" href="#" target="_blank" rel="noopener" data-text="cinema.failedLink"></a>
          </div>
        </div>
        <div class="curtain curtain--left" aria-hidden="true"></div>
        <div class="curtain curtain--right" aria-hidden="true"></div>
        <div class="stage__valance" aria-hidden="true"></div>
        <div class="stage__overlay">
          <button class="ticket" id="ticket" type="button" aria-label="Play our film">
            <span class="ticket__main">
              <span class="ticket__top" data-text="cinema.ticketTop"></span>
              <span class="ticket__name" data-text="herName"></span>
              <span class="ticket__action">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z"/></svg>
                <span data-text="cinema.ticketAction"></span>
              </span>
            </span>
            <span class="ticket__stub"><span data-text="cinema.ticketStub"></span></span>
          </button>
        </div>
      </div>

      <div class="beam" aria-hidden="true"></div>
      <div class="cinema__dim" aria-hidden="true"></div>
      <div class="seats" aria-hidden="true"></div>

      <p class="cinema__after" id="cinema-after" hidden data-text="cinema.afterPlay"></p>
      <a class="scroll-cue" id="cinema-cue" href="#hero" aria-label="See more" hidden>&#9825;</a>
    </section>

    <!-- [1] Happy Birthday -->
    <section class="hero" id="hero">
      <div class="hero__hearts" id="hero-hearts" aria-hidden="true"></div>
      <p class="hero__greeting" id="hero-greeting">Happy birthday,</p>
      <figure class="polaroid polaroid--hero">
        <img class="polaroid__media" src="assests/3.jpg" alt="" width="960" height="1280">
      </figure>
      <h1 class="hero__name" id="hero-name" data-text="herName"></h1>
      <p class="hero__line" data-text="hero.line"></p>
      <a class="scroll-cue" href="#gallery" aria-label="See more">&#9825;</a>
    </section>

    <!-- [2] Every version of you -->
    <section class="gallery" id="gallery">
      <h2 class="section-title js-write" data-text="gallery.heading"></h2>
      <div class="gallery__board" id="gallery-board"></div>
    </section>

    <!-- [3] The poem -->
    <section class="poem" id="poem">
      <article class="letter">
        <h2 class="letter__title js-write" data-text="poem.title"></h2>
        <div class="letter__body" id="poem-body"></div>
        <p class="letter__sign js-write">&mdash; <span data-text="yourName"></span></p>
      </article>
    </section>

    <!-- [4] The game -->
    <section class="game" id="game">
      <h2 class="section-title js-write" data-text="game.heading"></h2>
      <p class="section-intro" data-text="game.intro"></p>
      <p class="game__count" id="game-count" aria-live="polite"></p>
      <div class="game__grid" id="game-grid"></div>
      <ol class="game__reasons" id="game-reasons"></ol>
      <div class="game__done" id="game-done" hidden>
        <p class="game__done-line" data-text="game.doneLine"></p>
        <button class="btn" id="game-continue" type="button" data-text="game.doneButton"></button>
      </div>
    </section>

    <!-- [5] The question + officially mine (unlocked by the game) -->
    <section class="finale" id="finale" hidden>
      <div class="finale__ask" id="finale-ask">
        <p class="finale__name"><span data-text="herName"></span>,</p>
        <h2 class="finale__question" data-text="finale.question"></h2>
        <p class="finale__sub" data-text="finale.subline"></p>
        <div class="finale__buttons">
          <button class="btn btn--yes" id="btn-yes" type="button"></button>
          <button class="btn btn--no" id="btn-no" type="button"></button>
        </div>
      </div>

      <div class="finale__official" id="finale-official" hidden>
        <h2 class="finale__heading" data-text="finale.officialHeading"></h2>
        <p class="finale__line" data-text="finale.officialLine"></p>

        <div class="certificate">
          <p class="certificate__title">Certificate of Love</p>
          <p class="certificate__small">This certifies that</p>
          <p class="certificate__name" data-text="herName"></p>
          <p class="certificate__small">is officially the girlfriend of</p>
          <p class="certificate__name" data-text="yourName"></p>
          <p class="certificate__date">Signed with love on <span id="cert-date"></span></p>
          <span class="certificate__seal" aria-hidden="true" data-text="herInitial"></span>
        </div>

        <figure class="phone">
          <div class="phone__screen">
            <img id="us-photo" alt="Us on a video call" width="1080" height="2400" loading="lazy">
          </div>
          <figcaption class="phone__caption" data-text="finale.usCaption"></figcaption>
        </figure>

        <p class="finale__last" data-text="finale.lastLine"></p>
        <p class="finale__sign">&mdash; <span data-text="yourName"></span></p>
        <a class="text-link" href="#poem">Read the poem again</a>
      </div>
    </section>
  </main>

  <!-- Where the film parks while she scrolls, and the button to tuck it away -->
  <div class="dock-slot" id="dock-slot" aria-hidden="true"></div>
  <button class="dock-toggle" id="dock-toggle" type="button" aria-expanded="true" aria-controls="player" hidden>Hide video</button>

</body>
</html>
